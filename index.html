<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>及时claw助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 36px;
    }
    .btn-call {
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
    }
    .btn-call:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
    }
    .btn-call:active {
      transform: translateY(0);
    }
    .status {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }
    .footer {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🦞</div>
    <h1>及时claw助手</h1>
    <p class="subtitle">USB 即插即用 · OpenClaw 便携版</p>
    <button class="btn-call" id="callBtn" onclick="callRust()">调用后端服务</button>
    <p class="status" id="status"></p>
  </div>
  <div class="footer">MIT License © 2026 及时claw助手</div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;

    async function callRust() {
      const btn = document.getElementById('callBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '调用中...';
      status.textContent = '';

      try {
        const result = await invoke('greet', { name: '及时claw用户' });
        status.textContent = result;
        status.style.color = '#4ade80';
        alert(result);
      } catch (err) {
        status.textContent = '错误: ' + err;
        status.style.color = '#f87171';
        alert('调用失败: ' + err);
      } finally {
        btn.disabled = false;
        btn.textContent = '调用后端服务';
      }
    }

    window.callRust = callRust;
  </script>
</body>
</html>
