<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>及时claw助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --sidebar-width: 240px;
      --primary-color: #667eea;
      --primary-dark: #764ba2;
      --bg-dark: #1a1a2e;
      --bg-darker: #16162a;
      --bg-card: #24243e;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --border-color: #333;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    
    /* 左侧边栏 */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-darker);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .logo-text h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .logo-text span {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    
    .agent-item {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    
    .agent-item:hover {
      background: var(--bg-card);
    }
    
    .agent-item.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
      border: 1px solid var(--primary-color);
    }
    
    .agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .agent-info h3 {
      font-size: 14px;
      font-weight: 500;
    }
    
    .agent-info p {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    
    /* 右侧主区域 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-darker);
    }
    
    .chat-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-title h2 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .chat-title span {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .chat-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border: none;
    }
    
    /* 对话区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    .message {
      max-width: 80%;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      margin-left: auto;
    }
    
    .message-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
    }
    
    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: #fff;
    }
    
    .message.assistant .message-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    
    .message-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      padding: 0 4px;
    }
    
    /* 输入区域 */
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-darker);
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .input-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
    }
    
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    
    .input-box textarea::placeholder {
      color: var(--text-secondary);
    }
    
    .send-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* 欢迎界面 */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
    }
    
    .welcome-screen h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .welcome-screen p {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }
    
    .quick-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .quick-btn {
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .quick-btn:hover {
      border-color: var(--primary-color);
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">🦞</div>
        <div class="logo-text">
          <h1>及时claw助手</h1>
          <span>USB 即插即用</span>
        </div>
      </div>
    </div>
    
    <div class="agent-list">
      <div class="agent-item active" data-agent="main">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #667eea, #764ba2);">🤖</div>
        <div class="agent-info">
          <h3>QClaw</h3>
          <p>官方默认Agent</p>
        </div>
      </div>
      
      <div class="agent-item" data-agent="xiaohongshu">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24);">📱</div>
        <div class="agent-info">
          <h3>小红书爆款操盘手</h3>
          <p>爆款内容创作</p>
        </div>
      </div>
      
      <div class="agent-item" data-agent="zimeiti">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #f39c12, #e67e22);">📝</div>
        <div class="agent-info">
          <h3>自媒体选题策划师</h3>
          <p>选题策划专家</p>
        </div>
      </div>
      
      <div class="agent-item" data-agent="zhibo">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">🎬</div>
        <div class="agent-info">
          <h3>直播电商主播教练</h3>
          <p>话术技巧指导</p>
        </div>
      </div>
      
      <div class="agent-item" data-agent="image">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);">🎨</div>
        <div class="agent-info">
          <h3>图像提示词工程师</h3>
          <p>AI绘图提示词</p>
        </div>
      </div>
      
      <div class="agent-item" data-agent="devops">
        <div class="agent-avatar" style="background: linear-gradient(135deg, #3498db, #2980b9);">⚙️</div>
        <div class="agent-info">
          <h3>DevOps自动化师</h3>
          <p>运维自动化专家</p>
        </div>
      </div>
    </div>
  </aside>
  
  <!-- 右侧主区域 -->
  <main class="main-content">
    <header class="chat-header">
      <div class="chat-title">
        <h2 id="currentAgentName">QClaw</h2>
        <span id="currentAgentDesc">官方默认Agent · 随时随地，帮您高效干活</span>
      </div>
      <div class="chat-actions">
        <button class="btn" onclick="clearChat()">清空对话</button>
        <button class="btn btn-primary" onclick="callBackend()">测试后端</button>
      </div>
    </header>
    
    <div class="chat-messages" id="chatMessages">
      <!-- 欢迎界面 -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🦞</div>
        <h2>欢迎使用及时claw助手</h2>
        <p>这是一个 USB 即插即用的 OpenClaw 便携版应用。从左侧选择一个 Agent 开始对话，或点击下方快捷按钮快速开始。</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickStart('帮我写一篇小红书爆款笔记')">📝 写爆款笔记</button>
          <button class="quick-btn" onclick="quickStart('帮我策划一个自媒体选题')">💡 选题策划</button>
          <button class="quick-btn" onclick="quickStart('帮我生成一张AI图片的提示词')">🎨 AI绘图</button>
        </div>
      </div>
    </div>
    
    <div class="chat-input-area">
      <div class="input-wrapper">
        <div class="input-box">
          <textarea 
            id="messageInput" 
            placeholder="输入消息，按 Enter 发送，Shift+Enter 换行..." 
            rows="1"
            onkeydown="handleKeyDown(event)"
          ></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </main>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    
    // Agent 数据
    const agents = {
      main: { name: 'QClaw', desc: '官方默认Agent · 随时随地，帮您高效干活' },
      xiaohongshu: { name: '小红书爆款操盘手', desc: '爆款内容创作 · 小红书运营专家' },
      zimeiti: { name: '自媒体选题策划师', desc: '选题策划专家 · 内容策略指导' },
      zhibo: { name: '直播电商主播教练', desc: '话术技巧指导 · 直播带货培训' },
      image: { name: '图像提示词工程师', desc: 'AI绘图提示词 · Midjourney/SD专家' },
      devops: { name: 'DevOps自动化师', desc: '运维自动化专家 · CI/CD架构设计' }
    };
    
    let currentAgent = 'main';
    let messages = [];
    
    // Agent 切换
    document.querySelectorAll('.agent-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.agent-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        
        currentAgent = item.dataset.agent;
        const agent = agents[currentAgent];
        document.getElementById('currentAgentName').textContent = agent.name;
        document.getElementById('currentAgentDesc').textContent = agent.desc;
        
        // 切换 Agent 时保留欢迎界面
        document.getElementById('welcomeScreen').style.display = 'flex';
      });
    });
    
    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      
      // 隐藏欢迎界面
      document.getElementById('welcomeScreen').style.display = 'none';
      
      // 添加用户消息
      addMessage('user', text);
      input.value = '';
      
      // 模拟 AI 回复
      document.getElementById('sendBtn').disabled = true;
      
      try {
        const result = await invoke('greet', { name: text });
        addMessage('assistant', result);
      } catch (err) {
        addMessage('assistant', `错误: ${err}`);
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    }
    
    function addMessage(role, content) {
      const chatMessages = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      
      msg.innerHTML = `
        <div class="message-bubble">${escapeHtml(content)}</div>
        <div class="message-meta">${role === 'user' ? '你' : agents[currentAgent].name} · ${time}</div>
      `;
      
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
    
    function clearChat() {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      document.getElementById('welcomeScreen').style.display = 'flex';
      messages = [];
    }
    
    async function callBackend() {
      try {
        const result = await invoke('greet', { name: '及时claw用户' });
        alert('后端调用成功: ' + result);
      } catch (err) {
        alert('后端调用失败: ' + err);
      }
    }
    
    function quickStart(text) {
      document.getElementById('messageInput').value = text;
      sendMessage();
    }
    
    // 导出到全局
    window.sendMessage = sendMessage;
    window.handleKeyDown = handleKeyDown;
    window.clearChat = clearChat;
    window.callBackend = callBackend;
    window.quickStart = quickStart;
  </script>
</body>
</html>
