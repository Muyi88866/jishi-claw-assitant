<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>及时claw助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --sidebar-width: 240px;
      --primary-color: #667eea;
      --primary-dark: #764ba2;
      --bg-dark: #1a1a2e;
      --bg-darker: #16162a;
      --bg-card: #24243e;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --border-color: #333;
      --success-color: #2ecc71;
      --error-color: #e74c3c;
      --warning-color: #f39c12;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    
    /* 左侧边栏 */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-darker);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .logo-text h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .logo-text span {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .connection-status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error-color);
      flex-shrink: 0;
    }
    
    .status-dot.connected {
      background: var(--success-color);
      box-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
    }
    
    .status-dot.connecting {
      background: var(--warning-color);
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    
    .agent-item {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    
    .agent-item:hover {
      background: var(--bg-card);
    }
    
    .agent-item.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
      border: 1px solid var(--primary-color);
    }
    
    .agent-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .agent-info h3 {
      font-size: 14px;
      font-weight: 500;
    }
    
    .agent-info p {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    
    /* 侧边栏底部 */
    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-color);
    }
    
    .sidebar-footer .btn {
      width: 100%;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    /* 右侧主区域 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-darker);
    }
    
    .chat-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .chat-title h2 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .chat-title span {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .chat-actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border: none;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: var(--success-color);
      border: none;
      color: #fff;
    }
    
    /* 对话区域 */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    .message {
      max-width: 80%;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      margin-left: auto;
    }
    
    .message-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .message.user .message-bubble {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: #fff;
    }
    
    .message.assistant .message-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    
    .message-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      padding: 0 4px;
    }
    
    .message.user .message-meta {
      text-align: right;
    }
    
    /* 打字动画 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1.4s infinite ease-in-out;
    }
    
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    
    /* 输入区域 */
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-darker);
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .input-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
    }
    
    .input-box:focus-within {
      border-color: var(--primary-color);
    }
    
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      font-family: inherit;
    }
    
    .input-box textarea::placeholder {
      color: var(--text-secondary);
    }
    
    .send-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    /* 欢迎界面 */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    
    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
    }
    
    .welcome-screen h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .welcome-screen p {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
    }
    
    .quick-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .quick-btn {
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .quick-btn:hover {
      border-color: var(--primary-color);
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    }
    
    /* 设置面板 */
    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .settings-overlay.show {
      display: flex;
    }
    
    .settings-panel {
      background: var(--bg-darker);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      width: 480px;
      max-width: 90vw;
    }
    
    .settings-panel h2 {
      font-size: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-color);
    }
    
    .form-group .hint {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    .settings-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }
  </style>
</head>
<body>
  <!-- 左侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">🦞</div>
        <div class="logo-text">
          <h1>及时claw助手</h1>
          <span>USB 即插即用</span>
        </div>
      </div>
      <div class="connection-status" id="connectionStatus" onclick="testConnection()">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">未连接</span>
      </div>
    </div>
    
    <div class="agent-list" id="agentList">
      <!-- Agent列表将由JS动态生成 -->
    </div>
    
    <div class="sidebar-footer">
      <button class="btn" onclick="openSettings()">⚙️ 连接设置</button>
    </div>
  </aside>
  
  <!-- 右侧主区域 -->
  <main class="main-content">
    <header class="chat-header">
      <div class="chat-title">
        <h2 id="currentAgentName">QClaw</h2>
        <span id="currentAgentDesc">官方默认Agent · 随时随地，帮您高效干活</span>
      </div>
      <div class="chat-actions">
        <button class="btn" onclick="clearChat()">清空对话</button>
        <button class="btn btn-primary" onclick="testConnection()">🔄 重连</button>
      </div>
    </header>
    
    <div class="chat-messages" id="chatMessages">
      <!-- 欢迎界面 -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🦞</div>
        <h2>欢迎使用及时claw助手</h2>
        <p>USB 即插即用的 OpenClaw 便携版应用。连接 OpenClaw 后，从左侧选择一个 Agent 开始对话。</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickStart('帮我写一篇小红书爆款笔记')">📝 写爆款笔记</button>
          <button class="quick-btn" onclick="quickStart('帮我策划一个自媒体选题')">💡 选题策划</button>
          <button class="quick-btn" onclick="quickStart('帮我生成一张AI图片的提示词')">🎨 AI绘图</button>
          <button class="quick-btn" onclick="quickStart('你好，请介绍一下你自己')">👋 打个招呼</button>
        </div>
      </div>
    </div>
    
    <div class="chat-input-area">
      <div class="input-wrapper">
        <div class="input-box">
          <textarea 
            id="messageInput" 
            placeholder="输入消息，按 Enter 发送，Shift+Enter 换行..." 
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </main>

  <!-- 设置面板 -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettingsOutside(event)">
    <div class="settings-panel">
      <h2>⚙️ OpenClaw 连接设置</h2>
      
      <div class="form-group">
        <label>服务地址</label>
        <input type="text" id="settingUrl" placeholder="http://127.0.0.1:28789" />
        <div class="hint">OpenClaw 服务地址，默认为本机 28789 端口</div>
      </div>
      
      <div class="form-group">
        <label>API 密钥（可选）</label>
        <input type="password" id="settingApiKey" placeholder="留空表示无需认证" />
        <div class="hint">如果 OpenClaw 设置了 API 密钥认证，请在此填写</div>
      </div>
      
      <div class="form-group">
        <label>模型</label>
        <input type="text" id="settingModel" placeholder="openclaw/main" />
        <div class="hint">模型名称，格式: openclaw 或 openclaw/<agentId></div>
      </div>
      
      <div class="settings-actions">
        <button class="btn" onclick="closeSettings()">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">💾 保存并连接</button>
      </div>
    </div>
  </div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    
    // Agent颜色和图标映射
    const agentStyles = [
      { gradient: 'linear-gradient(135deg, #667eea, #764ba2)', icon: '🤖' },
      { gradient: 'linear-gradient(135deg, #ff6b6b, #ee5a24)', icon: '📱' },
      { gradient: 'linear-gradient(135deg, #f39c12, #e67e22)', icon: '📝' },
      { gradient: 'linear-gradient(135deg, #e74c3c, #c0392b)', icon: '🎬' },
      { gradient: 'linear-gradient(135deg, #9b59b6, #8e44ad)', icon: '🎨' },
      { gradient: 'linear-gradient(135deg, #3498db, #2980b9)', icon: '⚙️' },
      { gradient: 'linear-gradient(135deg, #2ecc71, #27ae60)', icon: '💼' },
      { gradient: 'linear-gradient(135deg, #1abc9c, #16a085)', icon: '📊' },
      { gradient: 'linear-gradient(135deg, #e67e22, #d35400)', icon: '🔧' },
      { gradient: 'linear-gradient(135deg, #9b59b6, #6c5ce7)', icon: '🚀' },
    ];
    
    let currentAgentId = 'main';
    let chatHistories = {}; // 每个Agent独立的对话历史
    let isConnected = false;
    let isSending = false;
    let agentList = []; // 从API获取的Agent列表
    
    // ==================== Agent列表 ====================
    
    async function loadAgents() {
      try {
        const agents = await invoke('get_agents');
        agentList = agents;
        renderAgentList();
      } catch (err) {
        console.error('获取Agent列表失败:', err);
        // 如果获取失败，使用默认列表
        agentList = [{ id: 'main', name: 'QClaw', model_id: 'openclaw/main' }];
        renderAgentList();
      }
    }
    
    function renderAgentList() {
      const container = document.getElementById('agentList');
      container.innerHTML = '';
      
      agentList.forEach((agent, index) => {
        const style = agentStyles[index % agentStyles.length];
        const isActive = agent.id === currentAgentId;
        
        const el = document.createElement('div');
        el.className = 'agent-item' + (isActive ? ' active' : '');
        el.dataset.agent = agent.id;
        el.innerHTML = `
          <div class="agent-avatar" style="background: ${style.gradient};">${style.icon}</div>
          <div class="agent-info">
            <h3>${escapeHtml(agent.name)}</h3>
            <p>${escapeHtml(agent.model_id)}</p>
          </div>
        `;
        el.addEventListener('click', () => switchAgent(agent.id));
        container.appendChild(el);
      });
    }
    
    function switchAgent(agentId) {
      currentAgentId = agentId;
      
      // 初始化对话历史
      if (!chatHistories[agentId]) chatHistories[agentId] = [];
      
      // 更新UI高亮
      document.querySelectorAll('.agent-item').forEach(i => i.classList.remove('active'));
      document.querySelector(`.agent-item[data-agent="${agentId}"]`)?.classList.add('active');
      
      // 更新头部信息
      const agent = agentList.find(a => a.id === agentId);
      document.getElementById('currentAgentName').textContent = agent ? agent.name : 'QClaw';
      document.getElementById('currentAgentDesc').textContent = agent ? agent.model_id : '';
      
      // 恢复对话历史
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      
      if (chatHistories[agentId].length === 0) {
        document.getElementById('welcomeScreen').style.display = 'flex';
        chatMessages.appendChild(createWelcomeScreen());
      } else {
        document.getElementById('welcomeScreen')?.remove();
        chatHistories[agentId].forEach(msg => {
          addMessage(msg.role, msg.content);
        });
      }
    }
    
    function createWelcomeScreen() {
      const div = document.createElement('div');
      div.className = 'welcome-screen';
      div.id = 'welcomeScreen';
      div.innerHTML = `
        <div class="welcome-icon">🦞</div>
        <h2>欢迎使用及时claw助手</h2>
        <p>USB 即插即用的 OpenClaw 便携版应用。连接 OpenClaw 后，从左侧选择一个 Agent 开始对话。</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="quickStart('你好，请介绍一下你自己')">👋 打个招呼</button>
          <button class="quick-btn" onclick="quickStart('帮我写一篇小红书爆款笔记')">📝 写爆款笔记</button>
          <button class="quick-btn" onclick="quickStart('帮我策划一个自媒体选题')">💡 选题策划</button>
          <button class="quick-btn" onclick="quickStart('帮我生成一张AI图片的提示词')">🎨 AI绘图</button>
        </div>
      `;
      return div;
    }
    
    // ==================== 连接管理 ====================
    
    async function testConnection() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      
      statusDot.className = 'status-dot connecting';
      statusText.textContent = '连接中...';
      
      try {
        const result = await invoke('test_connection');
        isConnected = result.connected;
        
        if (result.connected) {
          statusDot.className = 'status-dot connected';
          statusText.textContent = '已连接';
          // 连接成功后加载Agent列表
          await loadAgents();
        } else {
          statusDot.className = 'status-dot';
          statusText.textContent = '未连接';
          addSystemMessage('⚠️ ' + result.message);
        }
      } catch (err) {
        isConnected = false;
        statusDot.className = 'status-dot';
        statusText.textContent = '连接失败';
        addSystemMessage('❌ 连接测试失败: ' + err);
      }
    }
    
    // ==================== 消息发送 ====================
    
    async function sendMessage() {
      if (isSending) return;
      
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      
      // 隐藏欢迎界面
      const welcome = document.getElementById('welcomeScreen');
      if (welcome) welcome.style.display = 'none';
      
      // 添加用户消息到UI
      addMessage('user', text);
      
      // 初始化对话历史
      if (!chatHistories[currentAgentId]) chatHistories[currentAgentId] = [];
      chatHistories[currentAgentId].push({ role: 'user', content: text });
      
      input.value = '';
      autoResize(input);
      
      if (!isConnected) {
        addMessage('assistant', '⚠️ 未连接到 OpenClaw 服务。请点击左下角"连接设置"配置连接信息，或点击"重连"按钮。');
        return;
      }
      
      // 显示打字动画
      isSending = true;
      document.getElementById('sendBtn').disabled = true;
      const typingEl = showTyping();
      
      try {
        // 构造消息列表
        const messages = chatHistories[currentAgentId].map(m => ({
          role: m.role,
          content: m.content
        }));
        
        const result = await invoke('send_chat_message', { 
          messages,
          agentId: currentAgentId
        });
        
        // 移除打字动画
        typingEl.remove();
        
        // 添加AI回复
        addMessage('assistant', result);
        chatHistories[currentAgentId].push({ role: 'assistant', content: result });
      } catch (err) {
        typingEl.remove();
        addMessage('assistant', '❌ 请求失败: ' + err);
      } finally {
        isSending = false;
        document.getElementById('sendBtn').disabled = false;
      }
    }
    
    // ==================== UI 辅助函数 ====================
    
    function addMessage(role, content) {
      const chatMessages = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const agent = agentList.find(a => a.id === currentAgentId);
      const senderName = role === 'user' ? '你' : (agent ? agent.name : 'AI');
      
      msg.innerHTML = `
        <div class="message-bubble">${escapeHtml(content)}</div>
        <div class="message-meta">${senderName} · ${time}</div>
      `;
      
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function addSystemMessage(content) {
      const chatMessages = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.style.cssText = 'text-align: center; padding: 12px; color: var(--text-secondary); font-size: 13px;';
      msg.textContent = content;
      chatMessages.appendChild(msg);
    }
    
    function showTyping() {
      const chatMessages = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.id = 'typingIndicator';
      msg.innerHTML = `
        <div class="message-bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msg;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
    
    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
    
    function clearChat() {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      chatHistories[currentAgentId] = [];
      chatMessages.appendChild(createWelcomeScreen());
    }
    
    function quickStart(text) {
      document.getElementById('messageInput').value = text;
      sendMessage();
    }
    
    // ==================== 设置面板 ====================
    
    function openSettings() {
      invoke('get_config').then(config => {
        document.getElementById('settingUrl').value = config.url || 'http://127.0.0.1:28789';
        document.getElementById('settingApiKey').value = config.api_key || '';
        document.getElementById('settingModel').value = config.model || 'openclaw/main';
        document.getElementById('settingsOverlay').classList.add('show');
      }).catch(err => {
        document.getElementById('settingUrl').value = 'http://127.0.0.1:28789';
        document.getElementById('settingApiKey').value = '';
        document.getElementById('settingModel').value = 'openclaw/main';
        document.getElementById('settingsOverlay').classList.add('show');
      });
    }
    
    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('show');
    }
    
    function closeSettingsOutside(event) {
      if (event.target === document.getElementById('settingsOverlay')) {
        closeSettings();
      }
    }
    
    async function saveSettings() {
      const config = {
        url: document.getElementById('settingUrl').value.trim() || 'http://127.0.0.1:28789',
        api_key: document.getElementById('settingApiKey').value.trim(),
        model: document.getElementById('settingModel').value.trim() || 'openclaw/main',
      };
      
      try {
        await invoke('save_config_cmd', { config });
        closeSettings();
        await testConnection();
      } catch (err) {
        alert('保存设置失败: ' + err);
      }
    }
    
    // ==================== 初始化 ====================
    
    // 页面加载时自动测试连接
    testConnection();
    
    // 导出到全局
    window.sendMessage = sendMessage;
    window.handleKeyDown = handleKeyDown;
    window.clearChat = clearChat;
    window.quickStart = quickStart;
    window.testConnection = testConnection;
    window.openSettings = openSettings;
    window.closeSettings = closeSettings;
    window.closeSettingsOutside = closeSettingsOutside;
    window.saveSettings = saveSettings;
    window.autoResize = autoResize;
  </script>
</body>
</html>
